<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股籌碼日報 • 外資動向</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="max-w-4xl mx-auto px-4 pt-8 pb-4">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold tracking-wider text-slate-500 uppercase">台股籌碼日報 • 外資動向</span>
            <span class="text-xs text-slate-400">資料日期 <span id="data-date">------</span></span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">現貨之外，期貨在說什麼？</h1>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl mx-auto px-4 space-y-4 sm:space-y-6">

        <!-- 1. 台股情緒指數 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">台股情緒指數</h2>
                    <div class="flex items-baseline space-x-2">
                        <span id="sentiment-score" class="text-3xl font-bold text-slate-900">--.-</span>
                        <span class="text-slate-400 text-xs">/100</span>
                    </div>
                </div>
                <div id="sentiment-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
                    載入中...
                </div>
            </div>

            <!-- Gauge Bar -->
            <div class="space-y-1.5">
                <div class="h-3 w-full rounded-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500 relative">
                    <div id="sentiment-pointer" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-slate-900 border-2 border-white rounded-full shadow transition-all duration-500" style="left: 50%;"></div>
                </div>
                <div class="flex justify-between text-[10px] font-medium text-slate-400">
                    <span>0 恐慌</span>
                    <span>50 中性</span>
                    <span>100 貪婪</span>
                </div>
            </div>
        </div>

        <!-- 2. 外資台指期淨未平倉 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">外資台指期淨未平倉</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="foreign-oi" class="text-3xl font-bold text-slate-900">---</span>
                <span id="foreign-oi-unit" class="text-lg font-semibold text-slate-700">口</span>
            </div>
            <div class="text-xs text-slate-500 flex items-center space-x-2">
                <span>較昨日 <span id="foreign-oi-diff" class="font-medium">-- 口</span></span>
                <span class="text-slate-300">|</span>
                <span id="foreign-oi-status" class="font-medium">----</span>
            </div>
        </div>

        <!-- 3. 散戶小台多空比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">散戶小台多空比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="small-tai-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                ≥20% 過熱（反指標）
            </div>
        </div>

        <!-- 4. 散戶微台多空比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">散戶微台多空比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="micro-tai-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                ≥20% 過熱（反指標）
            </div>
        </div>

        <!-- 5. Put/Call 未平倉比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Put/Call 未平倉比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="pc-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                >100% 偏多防護
            </div>
        </div>

        <!-- 6. 外資選擇權 (Call / Put 淨OI) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">外資選擇權 (Call / Put 淨OI)</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="opt-call" class="text-2xl font-bold text-slate-900">--</span>
                <span class="text-slate-400">/</span>
                <span id="opt-put" class="text-2xl font-bold text-slate-900">--</span>
            </div>
            <div id="opt-status" class="text-xs text-slate-500">
                --
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 mt-8 pt-4 border-t border-slate-200 text-right">
        <span class="text-xs text-slate-400">報表產出時間：<span id="report-time">--</span></span>
    </footer>

    <!-- JavaScript Data Handler -->
    <script>
        // 安全抓取 JSON 多種可能 key 的輔助函式
        function getVal(obj, keys) {
            for (let k of keys) {
                if (obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
            }
            return null;
        }

        function updateUI(data) {
            if (!data) return;

            // 1. 日期與產出時間
            const dateVal = getVal(data, ['date', 'data_date', 'Date', 'update_date']);
            if (dateVal) document.getElementById('data-date').innerText = dateVal;

            const timeVal = getVal(data, ['report_time', 'update_time', 'time', 'generated_at']);
            if (timeVal) document.getElementById('report-time').innerText = timeVal;

            // 2. 情緒指數
            const sentimentVal = getVal(data, ['sentiment', 'sentiment_index', 'emotion_index', 'sentiment_score']);
            if (sentimentVal !== null) {
                const score = parseFloat(sentimentVal);
                document.getElementById('sentiment-score').innerText = score.toFixed(1);
                
                const pointer = document.getElementById('sentiment-pointer');
                pointer.style.left = `${Math.min(Math.max(score, 0), 100)}%`;

                const badge = document.getElementById('sentiment-badge');
                if (score >= 60) {
                    badge.innerText = '貪婪';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-rose-100 text-rose-700';
                } else if (score <= 40) {
                    badge.innerText = '恐慌';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700';
                } else {
                    badge.innerText = '中性';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600';
                }
            }

            // 3. 外資台指期未平倉
            const foreignOiVal = getVal(data, ['foreign_oi', 'foreign_net_oi', 'foreign_futures', 'foreign_tx']);
            if (foreignOiVal !== null) {
                const oi = parseInt(foreignOiVal);
                const oiElem = document.getElementById('foreign-oi');
                oiElem.innerText = isNaN(oi) ? foreignOiVal : oi.toLocaleString();
                if (!isNaN(oi)) {
                    oiElem.className = oi < 0 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-rose-600';
                }
            }

            const foreignOiDiffVal = getVal(data, ['foreign_oi_diff', 'foreign_diff', 'foreign_oi_change']);
            if (foreignOiDiffVal !== null) {
                const diff = parseInt(foreignOiDiffVal);
                const diffText = !isNaN(diff) ? `${diff > 0 ? '+' : ''}${diff.toLocaleString()} 口` : `${foreignOiDiffVal} 口`;
                document.getElementById('foreign-oi-diff').innerText = diffText;
            }

            const foreignStatusVal = getVal(data, ['foreign_oi_status', 'foreign_status', 'foreign_oi_note']);
            if (foreignStatusVal) {
                document.getElementById('foreign-oi-status').innerText = foreignStatusVal;
            }

            // 4. 散戶小台多空比
            const smallTaiVal = getVal(data, ['small_tai_ratio', 'small_tai', 'retail_small_tai', 'small_tai_long_short_ratio']);
            if (smallTaiVal !== null) {
                const elem = document.getElementById('small-tai-ratio');
                const val = parseFloat(smallTaiVal);
                elem.innerText = isNaN(val) ? `${smallTaiVal}%` : `${val}%`;
                if (!isNaN(val)) {
                    elem.className = val >= 20 ? 'text-3xl font-bold text-rose-600' : (val <= -20 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-slate-900');
                }
            }

            // 5. 散戶微台多空比
            const microTaiVal = getVal(data, ['micro_tai_ratio', 'micro_tai', 'retail_micro_tai', 'micro_tai_long_short_ratio']);
            if (microTaiVal !== null) {
                const elem = document.getElementById('micro-tai-ratio');
                const val = parseFloat(microTaiVal);
                elem.innerText = isNaN(val) ? `${microTaiVal}%` : `${val}%`;
                if (!isNaN(val)) {
                    elem.className = val >= 20 ? 'text-3xl font-bold text-rose-600' : (val <= -20 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-slate-900');
                }
            }

            // 6. Put/Call 未平倉比
            const pcVal = getVal(data, ['pc_ratio', 'put_call_ratio', 'pc_oi_ratio']);
            if (pcVal !== null) {
                const val = parseFloat(pcVal);
                document.getElementById('pc-ratio').innerText = isNaN(val) ? `${pcVal}%` : `${val}%`;
            }

            // 7. 外資選擇權
            const optCallVal = getVal(data, ['opt_call', 'foreign_call', 'option_call']);
            if (optCallVal !== null) document.getElementById('opt-call').innerText = optCallVal;

            const optPutVal = getVal(data, ['opt_put', 'foreign_put', 'option_put']);
            if (optPutVal !== null) document.getElementById('opt-put').innerText = optPutVal;

            const optStatusVal = getVal(data, ['opt_status', 'option_status', 'opt_note']);
            if (optStatusVal) document.getElementById('opt-status').innerText = optStatusVal;
        }

        // 讀取 data.json
        fetch('data.json?v=' + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error('Data file fetch failed');
                return res.json();
            })
            .then(data => {
                updateUI(data);
            })
            .catch(err => {
                console.error('讀取 data.json 失敗:', err);
            });
    </script>
</body>
</html>
