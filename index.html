<!-- 1. 美股 VIX 卡片與走勢圖區塊 -->
<div class="card">
  <h3>美股 VIX 波動率指數 (90日)</h3>
  <div id="usVixSummary">載入中...</div>
  <div style="margin: 8px 0; font-size: 14px;">
    <span>美股 VIX 情緒分：<strong id="usVixSentimentScore">--</strong></span>
    <span style="margin-left: 16px;">台股 VIX 情緒分：<strong id="twVixSentimentScore">--</strong></span>
  </div>
  <div style="height: 260px; position: relative;">
    <canvas id="usVixChartCanvas"></canvas>
  </div>
</div>

<!-- 2. Chart.js（若頁面已引入可省略這行） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  let usVixChartInstance = null;

  function renderMarketLineChart(canvasId, chartInstanceRef, chartData, seriesLabel) {
    const ctx = document.getElementById(canvasId);
    if (!ctx || !chartData || !Array.isArray(chartData.dates)) return null;

    if (chartInstanceRef) {
      chartInstanceRef.destroy();
    }

    return new Chart(ctx, {
      type: "line",
      data: {
        labels: chartData.dates,
        datasets: [
          {
            label: seriesLabel,
            data: chartData.close,
            borderColor: "#2563eb",
            backgroundColor: "rgba(37, 99, 235, 0.08)",
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.15,
          },
          {
            label: "20MA",
            data: chartData.ma20,
            borderColor: "#f59e0b",
            borderWidth: 1.5,
            pointRadius: 0,
            borderDash: [4, 2],
          },
          {
            label: "60MA",
            data: chartData.ma60,
            borderColor: "#10b981",
            borderWidth: 1.5,
            pointRadius: 0,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: true, position: "top" },
        },
      },
    });
  }

  function renderVixAndSentiment(data) {
    if (data.usVix) {
      const sign = data.usVix.change >= 0 ? "+" : "";
      const summaryEl = document.getElementById("usVixSummary");
      if (summaryEl) {
        summaryEl.textContent =
          `${data.usVix.price} (${sign}${data.usVix.change} / ${sign}${data.usVix.changePercent}%)` +
          ` ・ ${data.usVix.light} ・ 美股日期 ${data.usVix.date}`;
      }
    }

    if (data.usVixChart) {
      usVixChartInstance = renderMarketLineChart(
        "usVixChartCanvas",
        usVixChartInstance,
        data.usVixChart,
        "美股 VIX (^VIX)"
      );
    }

    const scores = Array.isArray(data.sentimentScores) ? data.sentimentScores : [];
    const usItem = scores.find((item) => item.name === "美股VIX");
    const twItem = scores.find((item) => item.name === "台股VIX");

    const usScoreEl = document.getElementById("usVixSentimentScore");
    if (usScoreEl) {
      usScoreEl.textContent = usItem ? `${usItem.score} / 100` : "暫無資料";
    }

    const twScoreEl = document.getElementById("twVixSentimentScore");
    if (twScoreEl) {
      twScoreEl.textContent = twItem ? `${twItem.score} / 100` : "待補台股 VIX 來源";
    }
  }

  // 在你原本讀取 data.json 的地方呼叫 renderVixAndSentiment(data)
  async function loadDashboardVix() {
    try {
      const res = await fetch(`./data.json?t=${Date.now()}`);
      const data = await res.json();
      renderVixAndSentiment(data);
    } catch (err) {
      console.error("讀取 data.json 失敗:", err);
    }
  }

  document.addEventListener("DOMContentLoaded", loadDashboardVix);
</script>
