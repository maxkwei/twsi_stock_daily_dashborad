<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股籌碼日報 • 外資動向</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="max-w-4xl mx-auto px-4 pt-8 pb-4">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold tracking-wider text-slate-500 uppercase">台股籌碼日報 • 外資動向</span>
            <span class="text-xs text-slate-400">資料日期 <span id="data-date">------</span></span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">現貨之外，期貨在說什麼？</h1>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl mx-auto px-4 space-y-4 sm:space-y-6">

        <!-- 1. 台股情緒指數 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">台股情緒指數</h2>
                    <div class="flex items-baseline space-x-2">
                        <span id="sentiment-score" class="text-3xl font-bold text-slate-900">--.-</span>
                        <span class="text-slate-400 text-xs">/100</span>
                    </div>
                </div>
                <div id="sentiment-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
                    載入中...
                </div>
            </div>

            <!-- Gauge Bar -->
            <div class="space-y-1.5">
                <div class="h-3 w-full rounded-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500 relative">
                    <div id="sentiment-pointer" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-slate-900 border-2 border-white rounded-full shadow transition-all duration-500" style="left: 50%;"></div>
                </div>
                <div class="flex justify-between text-[10px] font-medium text-slate-400">
                    <span>0 恐慌</span>
                    <span>50 中性</span>
                    <span>100 貪婪</span>
                </div>
            </div>
        </div>

        <!-- 2. 外資台指期淨未平倉 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">外資台指期淨未平倉</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="foreign-oi" class="text-3xl font-bold text-slate-900">---</span>
                <span class="text-lg font-semibold text-slate-700">口</span>
            </div>
            <div class="text-xs text-slate-500 flex items-center space-x-2">
                <span>較昨日 <span id="foreign-oi-diff" class="font-medium">-- 口</span></span>
                <span class="text-slate-300">|</span>
                <span id="foreign-oi-status" class="font-medium">----</span>
            </div>
        </div>

        <!-- 3. 散戶小台多空比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">散戶小台多空比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="small-tai-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                ≥20% 過熱（反指標）
            </div>
        </div>

        <!-- 4. 散戶微台多空比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">散戶微台多空比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="micro-tai-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                ≥20% 過熱（反指標）
            </div>
        </div>

        <!-- 5. Put/Call 未平倉比 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Put/Call 未平倉比</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="pc-ratio" class="text-3xl font-bold text-slate-900">--%</span>
            </div>
            <div class="text-xs text-slate-400">
                >100% 偏多防護
            </div>
        </div>

        <!-- 6. 外資選擇權 (Call / Put 淨OI) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">外資選擇權 (Call / Put 淨OI)</h2>
            <div class="flex items-baseline space-x-2 mb-1">
                <span id="opt-call" class="text-2xl font-bold text-slate-900">--</span>
                <span class="text-slate-400">/</span>
                <span id="opt-put" class="text-2xl font-bold text-slate-900">--</span>
            </div>
            <div id="opt-status" class="text-xs text-slate-500">
                口數；正=偏買方
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 mt-8 pt-4 border-t border-slate-200 text-right">
        <span class="text-xs text-slate-400">報表產出時間：<span id="report-time">--</span></span>
    </footer>

    <!-- JavaScript Data Handler (雙重相容版) -->
    <script>
        function updateUI(data) {
            if (!data) return;

            // 1. 日期與時間
            const dateVal = data.date || data.data_date || data.Date;
            if (dateVal) document.getElementById('data-date').innerText = dateVal;

            const timeVal = data.updateTime || data.update_time || data.report_time;
            if (timeVal) document.getElementById('report-time').innerText = timeVal;

            // 2. 台股情緒指數
            if (data.sentiment !== undefined) {
                const score = parseFloat(data.sentiment);
                document.getElementById('sentiment-score').innerText = score.toFixed(1);
                document.getElementById('sentiment-pointer').style.left = `${Math.min(Math.max(score, 0), 100)}%`;

                const badge = document.getElementById('sentiment-badge');
                const statusText = data.sentimentStatus || (score >= 60 ? '貪婪' : (score <= 40 ? '恐慌' : '震盪整理期(中性)'));
                badge.innerText = statusText;
                
                if (score >= 60) {
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-rose-100 text-rose-700';
                } else if (score <= 40) {
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700';
                } else {
                    badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600';
                }
            }

            // 3. 外資台指期淨未平倉 (支援 foreignFutures 與 foreign_oi)
            const foreignOiVal = data.foreignFutures !== undefined ? data.foreignFutures : data.foreign_oi;
            if (foreignOiVal !== undefined && foreignOiVal !== null) {
                const elem = document.getElementById('foreign-oi');
                elem.innerText = typeof foreignOiVal === 'number' ? foreignOiVal.toLocaleString() : foreignOiVal;
                
                const numVal = parseInt(String(foreignOiVal).replace(/,/g, ''));
                if (!isNaN(numVal)) {
                    elem.className = numVal < 0 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-rose-600';
                }
            }

            const foreignDiffVal = data.foreignChange !== undefined ? data.foreignChange : data.foreign_oi_diff;
            if (foreignDiffVal !== undefined && foreignDiffVal !== null) {
                document.getElementById('foreign-oi-diff').innerText = `${foreignDiffVal} 口`;
            }

            const foreignNoteVal = data.foreignNote || data.foreign_oi_status;
            if (foreignNoteVal) {
                document.getElementById('foreign-oi-status').innerText = foreignNoteVal;
            }

            // 4. 散戶小台多空比 (支援 retailSmall 與 small_tai_ratio)
            const retailSmallVal = data.retailSmall !== undefined ? data.retailSmall : data.small_tai_ratio;
            if (retailSmallVal !== undefined && retailSmallVal !== null) {
                const elem = document.getElementById('small-tai-ratio');
                const numVal = parseFloat(retailSmallVal);
                elem.innerText = isNaN(numVal) ? `${retailSmallVal}%` : `${numVal >= 0 ? '+' : ''}${numVal}%`;
                if (!isNaN(numVal)) {
                    elem.className = numVal >= 20 ? 'text-3xl font-bold text-rose-600' : (numVal <= -20 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-slate-900');
                }
            }

            // 5. 散戶微台多空比 (支援 retailMicro 與 micro_tai_ratio)
            const retailMicroVal = data.retailMicro !== undefined ? data.retailMicro : data.micro_tai_ratio;
            if (retailMicroVal !== undefined && retailMicroVal !== null) {
                const elem = document.getElementById('micro-tai-ratio');
                const numVal = parseFloat(retailMicroVal);
                elem.innerText = isNaN(numVal) ? `${retailMicroVal}%` : `${numVal >= 0 ? '+' : ''}${numVal}%`;
                if (!isNaN(numVal)) {
                    elem.className = numVal >= 20 ? 'text-3xl font-bold text-rose-600' : (numVal <= -20 ? 'text-3xl font-bold text-emerald-600' : 'text-3xl font-bold text-slate-900');
                }
            }

            // 6. Put/Call 未平倉比 (支援 pcRatio 與 pc_ratio)
            const pcVal = data.pcRatio !== undefined ? data.pcRatio : data.pc_ratio;
            if (pcVal !== undefined && pcVal !== null) {
                document.getElementById('pc-ratio').innerText = `${pcVal}%`;
            }

            // 7. 外資選擇權 (支援 optionCall / optionPut 與 opt_call / opt_put)
            const callVal = data.optionCall !== undefined ? data.optionCall : data.opt_call;
            if (callVal !== undefined && callVal !== null) document.getElementById('opt-call').innerText = callVal;

            const putVal = data.optionPut !== undefined ? data.optionPut : data.opt_put;
            if (putVal !== undefined && putVal !== null) document.getElementById('opt-put').innerText = putVal;
        }

        // 讀取 data.json
        fetch('data.json?v=' + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error('data.json 讀取失敗');
                return res.json();
            })
            .then(data => updateUI(data))
            .catch(err => console.error('無法讀取數據:', err));
    </script>
</body>
</html>
